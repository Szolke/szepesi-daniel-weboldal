<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szepesi Dániel – Belépés</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-deep: #2d4a2d;
            --green-mid: #4a7c59;
            --green-pale: #d4e8d8;
            --earth-pale: #f0e8d8;
            --cream: #faf8f4;
            --gold: #c9a84c;
            --text-mid: #3d5a3d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--earth-pale) 50%, var(--green-pale) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(45,74,45,0.15);
            text-align: center;
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            background: var(--green-pale);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .lock-icon svg {
            width: 28px;
            height: 28px;
            color: var(--green-mid);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--green-deep);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-mid);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--green-deep);
            margin-bottom: 0.5rem;
            letter-spacing: 0.04em;
        }

        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #d8e8d0;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            color: var(--green-deep);
            background: var(--cream);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            letter-spacing: 0.1em;
        }

        input[type="password"]:focus {
            border-color: var(--green-mid);
            box-shadow: 0 0 0 3px rgba(74,124,89,0.12);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--green-deep);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            letter-spacing: 0.04em;
        }

        .btn:hover {
            background: var(--green-mid);
            transform: translateY(-1px);
        }

        .error-msg {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #fff0f0;
            border: 1px solid #ffcccc;
            border-radius: 8px;
            color: #c0392b;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="lock-card">
        <div class="lock-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h1>Szepesi Dániel</h1>
        <p class="subtitle">Az oldal megtekintéséhez add meg a jelszót</p>

        <div class="form-group">
            <label for="password">Jelszó</label>
            <input type="password" id="password" placeholder="••••••••••" autofocus>
        </div>

        <button class="btn" onclick="checkPassword()">Belépés</button>
        <div class="error-msg" id="errorMsg">❌ Hibás jelszó. Kérlek próbáld újra.</div>

        <p class="footer-note">Life Coach & Holisztikus Terapeuta</p>
    </div>

    <script>
        const HASH = "0004cb0a6293ff7fc3608c7c60aabe5a8d784ca93c0cc8c08398ad3a3e0acd52";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkPassword() {
            const input = document.getElementById('password').value;
            const inputHash = await sha256(input);

            if (inputHash === HASH) {
                sessionStorage.setItem('auth', HASH);
                window.location.href = 'main.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // Ha már be van lépve, ugrás a főoldalra
        if (sessionStorage.getItem('auth') === HASH) {
            window.location.href = 'main.html';
        }
    </script>
</body>
</html>
